# Layout Classifier 训练配置文件
# 修改此文件来适配不同的版式分类任务

data:
  root: ../data/raw                     # 数据集根目录（相对于 vit 项目目录）
  categories:                           # 版式类别列表（文件夹名 = 标签名）
    - 身份证
    - 发票
    - 营业执照
    - 菜品报销小票
    - 合同
  train_ratio: 0.8                      # 训练集比例，剩余为验证集
  seed: 42                              # 数据集划分随机种子

model:
  path: ../models                       # CLIP 模型文件路径
  freeze_encoder: true                  # 是否冻结 ViT 编码器
  dropout: 0.1                          # 分类头 dropout 概率
  projection_dim: null                  # 分类头中间维度，null 则不添加中间层
  pool: cls                             # 特征提取方式: "cls" 或 "mean"

training:
  batch_size: 32
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  lr_scheduler: cosine                  # cosine / step / null
  early_stop_patience: 10               # 验证准确率不再提升的容忍轮数
  class_balance: weighted_loss          # none / weighted_loss / oversample
  num_workers: 4                        # DataLoader 进程数
  save_best_only: true                  # 只保存最佳 checkpoint
  mixed_precision: false                # 是否启用 AMP 混合精度（冻结训练一般不需要）
  log_interval: 10                      # 每 N 个 batch 打印一次日志

calibration:                            # 训练完成后的温度校准与置信度拒绝阈值
  enabled: true                         # 是否执行（best model 训练完成后自动生成阈值）
  percentile: 5                         # 正确样本置信度/间隔分位数(%)，95% 正确样本不被误拒
  safety_factor: 0.9                    # 分位数乘系数，防止验证集乐观偏差
  temperature_bounds: [0.1, 10.0]       # 温度拟合范围
  confidence_threshold_min: 0.3         # 绝对置信度阈值下限
  confidence_threshold_max: 0.9         # 绝对置信度阈值上限
  margin_threshold_min: 0.02            # top1-top2 间隔阈值下限
  margin_threshold_max: 0.5             # top1-top2 间隔阈值上限

output:
  dir: ../output                        # checkpoint 和日志输出目录
  model_name: layout_classifier.pth     # 保存的模型文件名
