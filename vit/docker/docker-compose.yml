# 部署用 compose（纯运行，不构建镜像）
# 镜像需预先在服务器上 docker build 或 docker load 好。
# 训练和推理共用同一个卷布局，模型文件已在镜像内 /app/models，无需额外挂载。

services:
  train:
    image: layout-classifier:latest
    container_name: layout-train
    command: python scripts/train.py --config configs/train_config.yaml
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - ../configs:/app/configs
      - ../../data:/app/data:ro
      - ../../output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  serve:
    image: layout-classifier:latest
    container_name: layout-server
    command: python scripts/serve.py --checkpoint output/best_model.pth --port 8000
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - ../configs:/app/configs
      - ../../output:/app/output
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
