version: "3.8"

# 说明：
# - 代码通过 bind mount 挂载（镜像内已 COPY 一份作为基线），服务器整体拷贝项目目录即可，改代码后重启容器生效
# - CLIP 模型权重已 COPY 进 training/inference 镜像（/shared/models），无需挂载
# - 前端 dist 由 backend 容器启动时用镜像内 node_modules 离线重建，服务器无需 node
# - GPU 训练/推理：服务器需安装 NVIDIA 驱动 + nvidia-container-toolkit
services:
  backend:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../output:/shared/output
      - ../server:/app/server
      - ../src:/app/src
      - ../configs:/app/configs
      - ../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - TRAINING_SERVICE_URL=http://training:8001
      - INFERENCE_SERVICE_URL=http://inference:8002
    depends_on:
      - training
      - inference
    restart: unless-stopped

  training:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: services/training/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../output:/shared/output
      - ../src:/app/src:ro
      - ../services/training/app.py:/app/app.py
      - training_tmp:/shared/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  inference:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: services/inference/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../output:/shared/output
      - ../src:/app/src:ro
      - ../services/inference/app.py:/app/app.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  training_tmp:
  frontend_node_modules:
